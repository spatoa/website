server {
    listen       80;
    listen       [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # BLOCK ACCESS TO HIDDEN FILES (.git, .env, etc)
    location ~ /\. {
        deny all;
        return 404;
    }
}