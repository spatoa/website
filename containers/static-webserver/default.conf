server {
    listen       80;
    listen       [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # Redirects /index.html to /
        if ($request_uri ~* ^(.*)\/index\.html$) {
            return 301 $1/;
        }

        try_files $uri $uri/ =404;
    }

    # BLOCK ACCESS TO HIDDEN FILES (.git, .env, etc)
    location ~ /\. {
        deny all;
        return 404;
    }
}