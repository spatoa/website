<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <!-- Metallic shutter gradient -->
    <linearGradient id="shutter-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="35%" stop-color="#f8fafc"/>
      <stop offset="65%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <!-- Disk body subtle gradient -->
    <linearGradient id="disk-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Floppy Disk Outer Case with Chamfered Top-Right Corner -->
  <polygon points="3,3 41,3 45,7 45,45 3,45" fill="url(#disk-body)" stroke="#020617" stroke-width="2" stroke-linejoin="round"/>

  <!-- Top Inset Texture Line -->
  <line x1="7" y1="5" x2="38" y2="5" stroke="#3b82f6" stroke-width="0.8"/>

  <!-- Metal Sliding Shutter (Top Half) -->
  <rect x="11" y="3" width="22" height="18" rx="1" fill="url(#shutter-metal)" stroke="#334155" stroke-width="1"/>
  <!-- Shutter Rectangular Drive Head Window -->
  <rect x="15" y="6" width="6" height="12" rx="1" fill="#0f172a"/>
  <!-- Shutter Spring Indent Slot -->
  <rect x="27" y="15" width="4" height="2" fill="#475569"/>

  <!-- Center Hub Spindle Ring Behind Label -->
  <circle cx="24" cy="31" r="5" fill="#020617" stroke="#1e293b" stroke-width="1"/>

  <!-- Paper Label Sticker (Bottom Half) -->
  <rect x="8" y="24" width="32" height="18" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
  <!-- Decorative Retro Color Header on Label -->
  <rect x="8" y="24" width="32" height="4" rx="1" fill="#ec4899"/>
  <rect x="8" y="28" width="32" height="2" fill="#06b6d4"/>

  <!-- Label Ruled Lines -->
  <line x1="11" y1="33" x2="37" y2="33" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="11" y1="36" x2="37" y2="36" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="11" y1="39" x2="37" y2="39" stroke="#cbd5e1" stroke-width="0.8"/>

  <!-- Hand-penned Disk Title -->
  <text x="12" y="35" font-family="'Courier New', monospace" font-size="5" font-weight="bold" fill="#0f172a">SYS_BOOT.IMG</text>
  <text x="25" y="41" font-family="Arial, sans-serif" font-size="3.5" font-weight="900" fill="#2563eb">1.44MB HD</text>

  <!-- Write-Protect Sliding Tab Notch (Bottom-Left & Bottom-Right) -->
  <rect x="5" y="41" width="3" height="3" fill="#000000"/>
  <rect x="40" y="41" width="3" height="3" fill="#000000"/>
  <rect x="40.5" y="41.5" width="2" height="2" fill="#ef4444"/>
</svg>
