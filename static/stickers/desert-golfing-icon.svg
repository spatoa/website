<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <clipPath id="squircle">
      <rect x="16" y="16" width="480" height="480" rx="96" ry="96" />
    </clipPath>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcedd0" />
      <stop offset="100%" stop-color="#f7d399" />
    </linearGradient>
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e29b53" />
      <stop offset="100%" stop-color="#bf7228" />
    </linearGradient>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Sky Background -->
    <rect x="0" y="0" width="512" height="512" fill="url(#skyGrad)" />

    <!-- Minimalist Sun Glow / Epoch Ring -->
    <circle cx="390" cy="120" r="44" fill="#fae8b4" opacity="0.6" />

    <!-- Distant Dunes -->
    <path d="M 0,330 Q 140,270 280,315 T 512,280 L 512,512 L 0,512 Z" fill="#d48a3f" opacity="0.4" />

    <!-- Foreground Sand Dune -->
    <path d="M 0,360 C 120,360 170,410 270,410 C 340,410 390,340 512,350 L 512,512 L 0,512 Z" fill="url(#sandGrad)" />

    <!-- Cup Trench -->
    <rect x="360" y="378" width="18" height="24" rx="2" fill="#783d0f" />

    <!-- Flagpole -->
    <line x1="362" y1="380" x2="362" y2="240" stroke="#1f2937" stroke-width="5" stroke-linecap="round" />

    <!-- Red Flag Pennant -->
    <polygon points="364,242 438,272 364,302" fill="#dc2626" />

    <!-- Golf Ball -->
    <circle cx="160" cy="378" r="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5" />
    <circle cx="157" cy="375" r="1.5" fill="#d1d5db" />
    <circle cx="163" cy="375" r="1.5" fill="#d1d5db" />
    <circle cx="160" cy="381" r="1.5" fill="#d1d5db" />

    <!-- Bevel Rim Border -->
    <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="none" stroke="#b45309" stroke-width="12" opacity="0.4" />
  </g>
</svg>
