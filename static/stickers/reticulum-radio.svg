<svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 52 52">
  <defs>
    <!-- RF wave glow filter -->
    <filter id="rf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Radiating RF Radio Waves from Antenna Tip (cx=26, cy=10) -->
  <!-- Wave Tier 1 -->
  <path d="M 21,7 A 7 7 0 0 1 31,7" fill="none" stroke="#39ff14" stroke-width="1.5" stroke-linecap="round" filter="url(#rf-glow)"/>
  <path d="M 19,13 A 8 8 0 0 0 19,7" fill="none" stroke="#39ff14" stroke-width="1.2" stroke-linecap="round" filter="url(#rf-glow)"/>
  <path d="M 33,13 A 8 8 0 0 1 33,7" fill="none" stroke="#39ff14" stroke-width="1.2" stroke-linecap="round" filter="url(#rf-glow)"/>

  <!-- Wave Tier 2 -->
  <path d="M 15,17 A 15 15 0 0 0 15,3" fill="none" stroke="#00f0ff" stroke-width="1.6" stroke-linecap="round" filter="url(#rf-glow)"/>
  <path d="M 37,17 A 15 15 0 0 1 37,3" fill="none" stroke="#00f0ff" stroke-width="1.6" stroke-linecap="round" filter="url(#rf-glow)"/>

  <!-- Wave Tier 3 (Outer) -->
  <path d="M 10,21 A 22 22 0 0 0 10,0" fill="none" stroke="#00f0ff" stroke-width="1.4" stroke-dasharray="2 2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 42,21 A 22 22 0 0 1 42,0" fill="none" stroke="#00f0ff" stroke-width="1.4" stroke-dasharray="2 2" stroke-linecap="round" opacity="0.8"/>

  <!-- Reticulum Mesh Packet Glyphs (Floating Data Nodes) -->
  <circle cx="9" cy="8" r="2" fill="#39ff14" stroke="#0f172a" stroke-width="0.8"/>
  <line x1="9" y1="8" x2="16" y2="14" stroke="#39ff14" stroke-width="0.7" stroke-dasharray="1 1"/>

  <circle cx="43" cy="8" r="2" fill="#00f0ff" stroke="#0f172a" stroke-width="0.8"/>
  <line x1="43" y1="8" x2="36" y2="14" stroke="#00f0ff" stroke-width="0.7" stroke-dasharray="1 1"/>

  <polygon points="6,26 8,24 10,26 8,28" fill="#38bdf8"/>
  <polygon points="44,26 46,24 48,26 46,28" fill="#38bdf8"/>

  <!-- Antenna Mast & Lattice Tower -->
  <!-- Beacon light at top of mast -->
  <line x1="26" y1="6" x2="26" y2="16" stroke="#94a3b8" stroke-width="1.8"/>
  <circle cx="26" cy="5" r="2" fill="#ef4444" stroke="#991b1b" stroke-width="0.8"/>
  <circle cx="26" cy="5" r="0.8" fill="#fecaca"/>

  <!-- Lattice Tower Struts -->
  <polygon points="23,16 29,16 33,40 19,40" fill="#0f172a" stroke="#020617" stroke-width="1.5"/>
  <!-- Cross bracings -->
  <line x1="23" y1="18" x2="31" y2="28" stroke="#38bdf8" stroke-width="1"/>
  <line x1="29" y1="18" x2="21" y2="28" stroke="#38bdf8" stroke-width="1"/>
  <line x1="21" y1="28" x2="33" y2="39" stroke="#38bdf8" stroke-width="1"/>
  <line x1="31" y1="28" x2="19" y2="39" stroke="#38bdf8" stroke-width="1"/>
  <line x1="22" y1="28" x2="30" y2="28" stroke="#38bdf8" stroke-width="1.2"/>

  <!-- Heavy Base Transmitter Platform -->
  <rect x="13" y="40" width="26" height="9" rx="2" fill="#1e293b" stroke="#000000" stroke-width="1.5"/>
  <rect x="15" y="42" width="22" height="5" rx="1" fill="#020617"/>
  <!-- Text on platform -->
  <text x="26" y="46" font-family="'Lucida Console', monospace" font-size="3.2" font-weight="bold" fill="#00f0ff" text-anchor="middle">RNS // MESH</text>
  <!-- Tiny LED lights on chassis -->
  <circle cx="16.5" cy="41" r="0.8" fill="#22c55e"/>
  <circle cx="35.5" cy="41" r="0.8" fill="#eab308"/>
</svg>
