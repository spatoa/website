<svg xmlns="http://www.w3.org/2000/svg" width="88" height="31" viewBox="0 0 88 31" shape-rendering="crispEdges">
  <!-- Outer Beveled Gray Frame -->
  <rect width="88" height="31" fill="#c0c0c0"/>
  <rect x="0" y="0" width="88" height="1" fill="#ffffff"/>
  <rect x="0" y="0" width="1" height="31" fill="#ffffff"/>
  <rect x="87" y="0" width="1" height="31" fill="#404040"/>
  <rect x="0" y="30" width="88" height="1" fill="#404040"/>

  <!-- Left Side: Retro CRT Computer Monitor Icon -->
  <!-- Monitor Case -->
  <rect x="5" y="4" width="22" height="18" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
  <rect x="6" y="5" width="20" height="1" fill="#ffffff"/>
  <!-- Glowing CRT Glass Tube -->
  <rect x="7" y="6" width="18" height="13" fill="#082f49"/>
  <!-- Glowing Screen Pixels / Mini Window -->
  <rect x="9" y="8" width="10" height="2" fill="#38bdf8"/>
  <rect x="9" y="11" width="6" height="5" fill="#0284c7"/>
  <circle cx="21" cy="18" r="0.8" fill="#22c55e"/> <!-- Green Power LED -->
  <!-- Swivel Stand Neck & Foot -->
  <rect x="13" y="22" width="6" height="3" fill="#94a3b8"/>
  <polygon points="10,27 22,27 24,25 8,25" fill="#cbd5e1" stroke="#475569" stroke-width="0.8"/>

  <!-- Divider -->
  <rect x="30" y="2" width="1" height="27" fill="#808080"/>
  <rect x="31" y="2" width="1" height="27" fill="#ffffff"/>

  <!-- Right Side Text Area -->
  <text x="35" y="11" font-family="'Lucida Console', monospace" font-size="6.5" font-weight="bold" fill="#000080" letter-spacing="-0.5">BEST VIEWED</text>
  <!-- Dark Inset LCD Display Box for Resolution -->
  <rect x="34" y="14" width="50" height="13" fill="#000000"/>
  <rect x="34" y="14" width="50" height="1" fill="#404040"/>
  <rect x="34" y="14" width="1" height="13" fill="#404040"/>
  <text x="36" y="24" font-family="'Lucida Console', monospace" font-size="8.5" font-weight="bold" fill="#22c55e" letter-spacing="-0.2">1024x768</text>
</svg>
