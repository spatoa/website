<svg xmlns="http://www.w3.org/2000/svg" width="38" height="52" viewBox="0 0 38 52">
  <defs>
    <!-- Metallic phone shell gradient -->
    <linearGradient id="phone-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <!-- Chrome accent gradient -->
    <linearGradient id="chrome-shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- External Stub Antenna -->
  <rect x="7" y="2" width="5" height="7" rx="2" fill="#0c4a6e" stroke="#000000" stroke-width="1.2"/>
  <rect x="8" y="3" width="3" height="2" fill="#38bdf8"/>

  <!-- Phone Clamshell Body -->
  <rect x="5" y="7" width="28" height="39" rx="5" fill="url(#phone-metal)" stroke="#000000" stroke-width="1.8"/>

  <!-- Inner Bevel Rim -->
  <rect x="7" y="9" width="24" height="35" rx="3.5" fill="none" stroke="url(#chrome-shine)" stroke-width="1"/>

  <!-- Top Camera Lens & Flash -->
  <circle cx="19" cy="14" r="3" fill="#0f172a" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="19" cy="14" r="1.5" fill="#0284c7"/>
  <circle cx="19.5" cy="13.5" r="0.6" fill="#ffffff"/>
  <circle cx="26" cy="14" r="1" fill="#facc15"/>

  <!-- External Mini LCD Display Frame -->
  <rect x="9" y="19" width="20" height="15" rx="2" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
  <!-- Glowing OLED screen -->
  <rect x="11" y="21" width="16" height="11" rx="1" fill="#002b36"/>

  <!-- Screen Content: Clock & Signal -->
  <!-- Signal bars -->
  <rect x="12" y="26" width="1" height="2" fill="#22c55e"/>
  <rect x="13.5" y="25" width="1" height="3" fill="#22c55e"/>
  <rect x="15" y="24" width="1" height="4" fill="#22c55e"/>
  <rect x="16.5" y="23" width="1" height="5" fill="#22c55e"/>
  <!-- Battery indicator -->
  <rect x="22" y="23" width="4" height="2.5" fill="none" stroke="#38bdf8" stroke-width="0.6"/>
  <rect x="23" y="24" width="2" height="1" fill="#38bdf8"/>

  <!-- Time Display -->
  <text x="19" y="30.5" font-family="'Lucida Console', monospace" font-size="4.2" font-weight="bold" fill="#00ffcc" text-anchor="middle">13:37</text>

  <!-- Brand / Status Logo below screen -->
  <circle cx="19" cy="38" r="2.5" fill="#0c4a6e" stroke="url(#chrome-shine)" stroke-width="0.8"/>
  <text x="19" y="39.2" font-family="Arial, sans-serif" font-size="2.5" font-weight="900" fill="#ffffff" text-anchor="middle">M</text>

  <!-- Bottom Cylindrical Hinge Knuckle -->
  <rect x="6" y="44" width="26" height="5" rx="2" fill="url(#chrome-shine)" stroke="#000000" stroke-width="1.2"/>
  <line x1="12" y1="44" x2="12" y2="49" stroke="#334155" stroke-width="0.8"/>
  <line x1="26" y1="44" x2="26" y2="49" stroke="#334155" stroke-width="0.8"/>
</svg>
