<svg xmlns="http://www.w3.org/2000/svg" width="56" height="40" viewBox="0 0 56 40">
  <defs>
    <!-- CRT glow filter -->
    <filter id="crt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Terminal Window Chrome Frame -->
  <rect x="2" y="2" width="52" height="36" rx="3" fill="#090d16" stroke="#000000" stroke-width="1.8"/>

  <!-- Titlebar -->
  <rect x="3" y="3" width="50" height="7" rx="2" fill="#1e293b"/>
  <!-- Window Control Buttons (Red, Yellow, Green) -->
  <circle cx="6.5" cy="6.5" r="1.5" fill="#ef4444"/>
  <circle cx="10.5" cy="6.5" r="1.5" fill="#eab308"/>
  <circle cx="14.5" cy="6.5" r="1.5" fill="#22c55e"/>
  <!-- Titlebar text -->
  <text x="20" y="8" font-family="'Lucida Console', monospace" font-size="4" font-weight="bold" fill="#94a3b8">term://root</text>

  <!-- CRT Screen Bezel & Screen -->
  <rect x="4" y="11" width="48" height="25" fill="#050a0e" stroke="#1e293b" stroke-width="0.8"/>

  <!-- Left: Flagpole & Red Checkered CTF Flag -->
  <!-- Mast -->
  <line x1="8" y1="13" x2="8" y2="33" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="8" cy="13" r="1.2" fill="#facc15"/>
  <!-- Waving Red Hacker Flag -->
  <path d="M 9,14 Q 16,12 21,15 Q 16,19 22,23 Q 15,20 9,21 Z" fill="#dc2626" stroke="#991b1b" stroke-width="0.8"/>
  <text x="11" y="18.5" font-family="Arial, sans-serif" font-size="3.5" font-weight="900" fill="#ffffff">CTF</text>

  <!-- Terminal Command Prompt & Captured Flag -->
  <text x="24" y="18" font-family="'Lucida Console', monospace" font-size="4.5" fill="#4ade80" filter="url(#crt-glow)"># ./pwn</text>
  <text x="24" y="24" font-family="'Lucida Console', monospace" font-size="4.2" font-weight="bold" fill="#38bdf8">[ROOT!]</text>
  <text x="12" y="31.5" font-family="'Lucida Console', monospace" font-size="4" font-weight="bold" fill="#22c55e" filter="url(#crt-glow)">FLAG{pwn3d}</text>
  <!-- Blinking Cursor Block -->
  <rect x="43" y="27.5" width="3" height="4.5" fill="#22c55e" opacity="0.8"/>
</svg>
