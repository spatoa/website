<svg xmlns="http://www.w3.org/2000/svg" width="46" height="48" viewBox="0 0 46 48">
  <!-- Feet -->
  <ellipse cx="14" cy="44" rx="8" ry="4" fill="#ff9900" stroke="#000" stroke-width="1.5"/>
  <ellipse cx="32" cy="44" rx="8" ry="4" fill="#ff9900" stroke="#000" stroke-width="1.5"/>
  <!-- Body -->
  <ellipse cx="23" cy="27" rx="16" ry="17" fill="#000000"/>
  <!-- Belly -->
  <ellipse cx="23" cy="30" rx="11" ry="13" fill="#ffffff"/>
  <!-- Flippers -->
  <ellipse cx="7" cy="28" rx="4" ry="10" fill="#000000" transform="rotate(20 7 28)"/>
  <ellipse cx="39" cy="28" rx="4" ry="10" fill="#000000" transform="rotate(-20 39 28)"/>
  <!-- Head -->
  <ellipse cx="23" cy="14" rx="12" ry="11" fill="#000000"/>
  <!-- Eyes -->
  <ellipse cx="18" cy="12" rx="3.5" ry="5" fill="#ffffff"/>
  <ellipse cx="28" cy="12" rx="3.5" ry="5" fill="#ffffff"/>
  <circle cx="19" cy="13" r="1.8" fill="#000000"/>
  <circle cx="27" cy="13" r="1.8" fill="#000000"/>
  <!-- Beak -->
