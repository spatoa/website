<svg xmlns="http://www.w3.org/2000/svg" width="62" height="40" viewBox="0 0 62 40">
  <!-- Cassette Body -->
  <rect x="2" y="2" width="58" height="36" rx="4" fill="#1e293b" stroke="#000" stroke-width="1.5"/>
  <!-- Label area -->
  <rect x="8" y="6" width="46" height="23" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
  <!-- Top color stripes on label -->
  <rect x="8" y="6" width="46" height="4" fill="#ec4899"/>
  <rect x="8" y="10" width="46" height="3" fill="#06b6d4"/>
  <!-- Handwritten Title -->
  <text x="12" y="19" font-family="'Courier New', monospace" font-size="6.5" font-weight="bold" fill="#0f172a">MIX '05 ★</text>
  <!-- Tape window cutout -->
  <rect x="15" y="21" width="32" height="11" rx="2" fill="#0f172a" stroke="#475569" stroke-width="0.8"/>
  <!-- Left & right spools -->
  <circle cx="23" cy="26.5" r="3.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="39" cy="26.5" r="3.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="23" cy="26.5" r="1.5" fill="#0f172a"/>
  <circle cx="39" cy="26.5" r="1.5" fill="#0f172a"/>
  <!-- Bottom trapezoid tape runner -->
  <polygon points="12,38 18,33 44,33 50,38" fill="#0f172a" stroke="#000" stroke-width="1"/>
  <circle cx="21" cy="35.5" r="1.2" fill="#94a3b8"/>
  <circle cx="41" cy="35.5" r="1.2" fill="#94a3b8"/>
</svg>
