<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <!-- Prismatic Rainbow Sheen Gradient -->
    <linearGradient id="cd-rainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="25%" stop-color="#67e8f9"/>
      <stop offset="45%" stop-color="#f472b6"/>
      <stop offset="65%" stop-color="#facc15"/>
      <stop offset="85%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="hub-plastic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5f9" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="data-burn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#1d4ed8" stop-opacity="0.25"/>
      <stop offset="72%" stop-color="#60a5fa" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <!-- Outer Disc Ring -->
  <circle cx="24" cy="24" r="22" fill="url(#cd-rainbow)" stroke="#0f172a" stroke-width="1.8"/>

  <!-- Burned Data Track Area (Darker Ring with Visible Burn Boundary) -->
  <circle cx="24" cy="24" r="19" fill="url(#data-burn)" stroke="#38bdf8" stroke-width="0.5"/>
  <circle cx="24" cy="24" r="10" fill="none" stroke="#60a5fa" stroke-width="0.5" stroke-dasharray="1 1"/>

  <!-- Light Refraction Glare Triangles (Rainbow flares) -->
  <polygon points="24,24 6,10 12,5" fill="#f472b6" opacity="0.45"/>
  <polygon points="24,24 42,38 36,43" fill="#38bdf8" opacity="0.45"/>
  <polygon points="24,24 38,8 43,14" fill="#facc15" opacity="0.4"/>
  <polygon points="24,24 10,40 5,34" fill="#a78bfa" opacity="0.4"/>

  <!-- Inner Clear Plastic Hub Ring -->
  <circle cx="24" cy="24" r="8" fill="url(#hub-plastic)" stroke="#64748b" stroke-width="1"/>
  <!-- Stacking Ring -->
  <circle cx="24" cy="24" r="5.5" fill="none" stroke="#cbd5e1" stroke-width="0.8"/>
  <!-- Center Spindle Hole (Cutout) -->
  <circle cx="24" cy="24" r="3.2" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>

  <!-- Hand-written Sharpie Title on Top Half -->
  <path id="cd-text-path" d="M 6,24 A 18 18 0 0 1 42,24" fill="none"/>
  <text font-family="'Comic Sans MS', 'Chalkboard', cursive, sans-serif" font-size="4.2" font-weight="bold" fill="#0f172a" letter-spacing="0.4">
    <textPath href="#cd-text-path" startOffset="50%" text-anchor="middle">
      ★ MIX '04 (LACHLAN) ★
    </textPath>
  </text>
  <text x="24" y="37" font-family="'Courier New', monospace" font-size="3.2" font-weight="bold" fill="#1e293b" text-anchor="middle">CD-R 700MB</text>
</svg>
