<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <radialGradient id="grad-smile" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffb7d"/>
      <stop offset="70%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
  </defs>
  <!-- Yellow face with thick 2000s outline -->
  <circle cx="24" cy="24" r="21" fill="url(#grad-smile)" stroke="#000000" stroke-width="2.5"/>
  <!-- Cool retro sunglasses -->
  <polygon points="6,16 22,17 21,25 7,24" fill="#111111" stroke="#000" stroke-width="1.5"/>
  <polygon points="26,17 42,16 41,24 27,25" fill="#111111" stroke="#000" stroke-width="1.5"/>
  <rect x="21" y="18" width="6" height="3" fill="#000"/>
  <!-- Glare on glasses -->
  <line x1="9" y1="18" x2="18" y2="22" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="29" y1="18" x2="38" y2="22" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Grin smile -->
  <path d="M12 30 Q24 41 36 30" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Cheek dimple -->
  <line x1="10" y1="28" x2="13" y2="31" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="28" x2="35" y2="31" stroke="#000" stroke-width="2" stroke-linecap="round"/>
</svg>
