<!-- Fullscreen Background Layer for Placed Stickers -->
<div id="sticker-canvas-layer" aria-hidden="true"></div>

<!-- Collapsible Retro Sticker Book Drawer -->
<aside id="sticker-book-drawer" class="sticker-book-drawer collapsed" aria-label="Interactive Sticker Album">
  <button type="button" id="sticker-drawer-toggle" class="sticker-drawer-tab" aria-expanded="false" aria-controls="sticker-drawer-content">
    <span aria-hidden="true">&#9733;</span>
    <span>STICKER ALBUM</span>
    <span id="sticker-tab-arrow" aria-hidden="true">&#9650;</span>
  </button>
  <div id="sticker-drawer-content" class="sticker-drawer-body">
    <div class="sticker-drawer-title">
      CLICK &amp; DRAG STICKERS ONTO THE DESKTOP
    </div>
    <div class="sticker-palette" id="sticker-palette">
      {% include "partials/sticker_palette.html" %}
    </div>
    <div class="sticker-drawer-actions">
      <span class="sticker-hint">Positions saved automatically</span>
      <div style="display: flex; gap: 4px;">
        <button type="button" id="sticker-motion-btn" class="retro-btn" style="font-size: 9px; padding: 2px 6px;" title="Toggle sticker floating motion" aria-pressed="true">Motion: ON</button>
        <button type="button" id="sticker-clear-btn" class="retro-btn" style="font-size: 9px; padding: 2px 6px;">Reset Canvas</button>
      </div>
    </div>
  </div>
</aside>
