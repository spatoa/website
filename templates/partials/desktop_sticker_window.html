<section class="panel desktop-window" id="sticker-album-window"
         data-app-id="sticker-album-window"
         data-app-title="Sticker_Album.exe"
         data-app-icon="★"
         data-default-x="300"
         data-default-y="150"
         style="width: 340px; max-width: calc(100vw - 20px);">
  <div class="panel-header">
    <div class="panel-header-title">
      <span class="win-icon">&#9733;</span> Sticker_Album.exe &bull; Bling &amp; Badges
    </div>
    <div class="window-controls">
      <button type="button" class="window-btn" id="sticker-win-min-btn" title="Minimize">_</button>
      <button type="button" class="window-btn" id="sticker-win-close-btn" title="Close">&#10005;</button>
    </div>
  </div>

  <div class="panel-body" style="padding: 6px;">
    <div class="sticker-drawer-title" style="margin-bottom: 6px;">
      DRAG STICKERS ONTO THE DESKTOP WALLPAPER
    </div>
    <div class="sticker-palette" id="desktop-sticker-palette" style="max-height: 190px;">
      {% include "partials/sticker_palette.html" %}
    </div>
    <div class="sticker-drawer-actions" style="margin-top: 6px;">
      <span class="sticker-hint">Saved to Desktop OS profile</span>
      <div style="display: flex; gap: 4px;">
        <button type="button" id="desktop-sticker-motion-btn" class="retro-btn" style="font-size: 9px; padding: 2px 6px;" title="Toggle desktop sticker floating motion" aria-pressed="true">Motion: ON</button>
        <button type="button" id="desktop-sticker-clear-btn" class="retro-btn" style="font-size: 9px; padding: 2px 6px;">Clear Desktop</button>
      </div>
    </div>
  </div>
</section>
