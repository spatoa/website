<section class="panel desktop-window" id="sticker-album-window"
         data-app-id="sticker-album-window"
         data-app-title="Sticker_Album.exe"
         data-app-icon="★"
         data-default-x="300"
         data-default-y="150"
         style="width: 340px; max-width: calc(100vw - 20px);">
  <div class="panel-header">
    <div class="panel-header-title">
      <span class="win-icon">&#9733;</span> Sticker_Album.exe &bull; Bling &amp; Badges
    </div>
    <div class="window-controls">
      <button type="button" class="window-btn" id="sticker-win-min-btn" title="Minimize">_</button>
      <button type="button" class="window-btn" id="sticker-win-close-btn" title="Close">&#10005;</button>
    </div>
  </div>

  <div class="panel-body" style="padding: 6px;">
    <div class="sticker-drawer-title" style="margin-bottom: 6px;">
      DRAG STICKERS ONTO THE DESKTOP WALLPAPER
    </div>
    <div class="sticker-palette" id="desktop-sticker-palette" style="max-height: 190px;">
      <div class="sticker-item" data-src="{{ get_url(path='stickers/notepad-made.svg') | safe }}" title="Made with Notepad Badge" draggable="true">
        <img src="{{ get_url(path='stickers/notepad-made.svg') | safe }}" alt="Notepad Badge" loading="lazy">
      </div>
      <div class="sticker-item" data-src="{{ get_url(path='stickers/xhtml-valid.svg') | safe }}" title="W3C Valid XHTML Badge" draggable="true">
        <img src="{{ get_url(path='stickers/xhtml-valid.svg') | safe }}" alt="XHTML Badge" loading="lazy">
      </div>
      <div class="sticker-item" data-src="{{ get_url(path='stickers/firefox-now.svg') | safe }}" title="Get Firefox Badge" draggable="true">
        <img src="{{ get_url(path='stickers/firefox-now.svg') | safe }}" alt="Firefox Badge" loading="lazy">
      </div>
      <div class="sticker-item" data-src="{{ get_url(path='stickers/netscape-now.svg') | safe }}" title="Netscape Now Badge" draggable="true">
        <img src="{{ get_url(path='stickers/netscape-now.svg') | safe }}" alt="Netscape Badge" loading="lazy">
      </div>
      <div class="sticker-item" data-src="{{ get_url(path='stickers/under-construction.svg') | safe }}" title="Under Construction Warning" draggable="true">
        <img src="{{ get_url(path='stickers/under-construction.svg') | safe }}" alt="Under Construction" loading="lazy">
      </div>
      <div class="sticker-item" data-src="{{ get_url(path='stickers/sparkle-star.svg') | safe }}" title="Blingee Sparkle Star" draggable="true">
        <img src="{{ get_url(path='stickers/sparkle-star.svg') | safe }}" alt="Sparkle Star" loading="lazy">
      </div>
      <div class="sticker-item" data-src="{{ get_url(path='stickers/pixel-flame.svg') | safe }}" title="Pixel Flame Fire" draggable="true">
        <img src="{{ get_url(path='stickers/pixel-flame.svg') | safe }}" alt="Pixel Flame" loading="lazy">
      </div>
      <div class="sticker-item" data-src="{{ get_url(path='stickers/retro-smiley.svg') | safe }}" title="Cool Retro Sunglasses Smiley" draggable="true">
        <img src="{{ get_url(path='stickers/retro-smiley.svg') | safe }}" alt="Retro Smiley" loading="lazy">
      </div>
      <div class="sticker-item" data-src="{{ get_url(path='stickers/alien-ufo.svg') | safe }}" title="Cyber Y2K Alien UFO" draggable="true">
        <img src="{{ get_url(path='stickers/alien-ufo.svg') | safe }}" alt="Alien UFO" loading="lazy">
      </div>
      <div class="sticker-item" data-src="{{ get_url(path='stickers/winamp-whips.svg') | safe }}" title="Winamp 2.91 It Whips Badge" draggable="true">
        <img src="{{ get_url(path='stickers/winamp-whips.svg') | safe }}" alt="Winamp Badge" loading="lazy">
      </div>
      <div class="sticker-item" data-src="{{ get_url(path='stickers/ie-best.svg') | safe }}" title="Best Viewed in Internet Explorer 6.0" draggable="true">
        <img src="{{ get_url(path='stickers/ie-best.svg') | safe }}" alt="IE 6.0 Badge" loading="lazy">
      </div>
      <div class="sticker-item" data-src="{{ get_url(path='stickers/tux-penguin.svg') | safe }}" title="Linux Tux Penguin Sticker" draggable="true">
        <img src="{{ get_url(path='stickers/tux-penguin.svg') | safe }}" alt="Tux Penguin" loading="lazy">
      </div>
      <div class="sticker-item" data-src="{{ get_url(path='stickers/aim-running.svg') | safe }}" title="Running AIM Instant Messenger Badge" draggable="true">
        <img src="{{ get_url(path='stickers/aim-running.svg') | safe }}" alt="AIM Badge" loading="lazy">
      </div>
      <div class="sticker-item" data-src="{{ get_url(path='stickers/dialup-56k.svg') | safe }}" title="56K V.90 Dial-Up Ready Badge" draggable="true">
        <img src="{{ get_url(path='stickers/dialup-56k.svg') | safe }}" alt="56K Modem Badge" loading="lazy">
      </div>
      <div class="sticker-item" data-src="{{ get_url(path='stickers/y2k-butterfly.svg') | safe }}" title="Cyber-Y2K Glitter Butterfly" draggable="true">
        <img src="{{ get_url(path='stickers/y2k-butterfly.svg') | safe }}" alt="Y2K Butterfly" loading="lazy">
      </div>
      <div class="sticker-item" data-src="{{ get_url(path='stickers/cassette-mixtape.svg') | safe }}" title="Retro Cassette Mixtape Sticker" draggable="true">
        <img src="{{ get_url(path='stickers/cassette-mixtape.svg') | safe }}" alt="Cassette Tape" loading="lazy">
      </div>
      <div class="sticker-item" data-src="{{ get_url(path='stickers/pocket_pet-egg.svg') | safe }}" title="Pixel Pocket_Pet Virtual Pet Keychain" draggable="true">
        <img src="{{ get_url(path='stickers/pocket_pet-egg.svg') | safe }}" alt="Pocket_Pet" loading="lazy">
      </div>
      <div class="sticker-item" data-src="{{ get_url(path='stickers/no-spyware.svg') | safe }}" title="100% Clean No Spyware Certified" draggable="true">
        <img src="{{ get_url(path='stickers/no-spyware.svg') | safe }}" alt="No Spyware Badge" loading="lazy">
      </div>
    </div>
    <div class="sticker-drawer-actions" style="margin-top: 6px;">
      <span class="sticker-hint">Saved to Desktop OS profile</span>
      <div style="display: flex; gap: 4px;">
        <button type="button" id="desktop-sticker-motion-btn" class="retro-btn" style="font-size: 9px; padding: 2px 6px;" title="Toggle desktop sticker floating motion" aria-pressed="true">Motion: ON</button>
        <button type="button" id="desktop-sticker-clear-btn" class="retro-btn" style="font-size: 9px; padding: 2px 6px;">Clear Desktop</button>
      </div>
    </div>
  </div>
</section>
