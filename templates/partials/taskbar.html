<!-- Retro Windows Taskbar & Dock (Active in Desktop Mode) -->
<footer id="desktop-taskbar" class="desktop-taskbar" role="toolbar" aria-label="Desktop Window Taskbar">
  <button type="button" class="start-btn" id="start-menu-btn" aria-label="Start Menu" aria-haspopup="true" aria-expanded="false">
    <span aria-hidden="true">&#10022;</span>
    <span>Start</span>
  </button>
  <div class="taskbar-tasks" id="taskbar-tasks" role="tablist" aria-label="Running Windows"></div>
  <div class="taskbar-tray">
    <div class="taskbar-clock" id="taskbar-clock" aria-label="Current System Time">12:00 PM</div>
    <button type="button" class="show-desktop-btn" id="show-desktop-btn" title="Show Desktop (Minimize/Restore all windows)" aria-label="Show Desktop"></button>
  </div>
</footer>
