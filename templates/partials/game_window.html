<!-- Interactive Client-Side Element: Game Player -->
<section class="panel desktop-window" id="interactive-element"
         data-app-id="interactive-element"
         data-app-title="Game_Player.exe"
         data-app-icon="🎮"
         data-default-x="530"
         data-default-y="350">
  <div class="panel-header">
    <div class="panel-header-title">
      <span class="win-icon">🎮</span> {{ config.extra.strings.header_game | default(value="★ Interactive Canvas ★") }}
    </div>
  </div>
  <div class="panel-body">
    <div class="game-viewport-wrap">
      <canvas id="wasm-canvas" width="380" height="200"></canvas>
      <div class="canvas-overlay-notice">Move cursor / touch to steer warp &bull; Click to burst stars</div>
    </div>
    <div class="win-statusbar">
      <span id="canvas-status">STATUS: RUNNING (60 FPS)</span>
      <span id="canvas-mode">MODE: 3D STARFIELD</span>
    </div>

    <div class="arcade-controls">
      <button class="retro-btn" id="btn-warp">Hyperdrive Speed</button>
      <button class="retro-btn" id="btn-toggle">Pause / Play</button>
      <button class="retro-btn" id="btn-theme">Toggle Color</button>
    </div>
    <div class="wasm-notice">
      &#9881; <em>Placeholder for upcoming WASM game binary / retro desktop env.</em>
    </div>
  </div>
</section>
