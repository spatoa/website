<!DOCTYPE html>
<html lang="{{ lang | default(value=config.default_language | default(value='en')) }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Desert Golfing</title>
  <meta name="description" content="Desert Golfing standalone 2D physics simulation and installable mobile progressive web app (PWA).">

  <!-- PWA Manifest & Fullscreen Mobile Meta -->
  <link rel="manifest" href="{{ get_url(path='golf-manifest.json') | safe }}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Desert Golfing">
  <meta name="theme-color" content="#e09953">
  <link rel="apple-touch-icon" href="{{ get_url(path='stickers/desert-golfing-icon.svg') | safe }}">
  <link rel="icon" type="image/svg+xml" href="{{ get_url(path='stickers/desert-golfing-icon.svg') | safe }}">

  <link rel="stylesheet" href="{{ get_url(path='css/components/desert_golfing_standalone.css') | safe }}">
</head>
<body class="golf-standalone-page">
  <canvas id="desert-golfing-canvas" role="img" aria-label="Desert Golfing 2D Physics Canvas"></canvas>

  <!-- Mobile Landscape Enforcer: Strictly blocks portrait orientation on mobile with no bypass -->
  <div id="golf-orientation-blocker" class="golf-orientation-blocker" role="alertdialog" aria-modal="true" aria-label="Landscape Orientation Required">
    <div class="orientation-blocker-content">
      <div class="orientation-icon wingdings" aria-hidden="true">🖵</div>
      <h1 class="orientation-title">★ LANDSCAPE REQUIRED ★</h1>
      <p class="orientation-text">Desert Golfing is designed exclusively for landscape view.</p>
      <div class="orientation-rotate-hint">
        <span class="rotate-glyph" aria-hidden="true">⟳</span>
        <span>Please rotate your device horizontally</span>
      </div>
    </div>
  </div>

  <script src="{{ get_url(path='js/pwa-runtime.js') | safe }}" defer></script>
  <script src="{{ get_url(path='js/desert-golfing.js') | safe }}" defer></script>
  <script>
    (function () {
      'use strict';

      function initStandaloneGolf() {
        const canvas = document.getElementById('desert-golfing-canvas');
        if (!canvas || !window.DesertGolfing) {
          setTimeout(initStandaloneGolf, 30);
          return;
        }

        // 1. Register Dedicated Scoped Service Worker
        if (window.PWARuntime) {
          window.PWARuntime.registerServiceWorker('/golf-sw.js', '/golf/');
          window.PWARuntime.attachGestureOrientationLock();
        }

        // 2. Initialize Game Engine Instance in Standalone Mode
        const game = window.DesertGolfing.createInstance(canvas, {
          isStandalone: true,
          resolutionIndependent: true
        });

        if (!game) return;

        // 3. Bind Dynamic Viewport Resize (Letterboxed 16:9 Canvas)
        function handleCanvasResize() {
          const rect = canvas.getBoundingClientRect();
          if (rect.width > 0 && rect.height > 0) {
            game.resize(rect.width, rect.height);
          }
        }

        if (window.PWARuntime) {
          window.PWARuntime.bindViewport(canvas, function (w, h) {
            game.resize(w, h);
          });
        } else {
          window.addEventListener('resize', handleCanvasResize);
          handleCanvasResize();
        }

        // 4. Orientation State Monitor & Blocker Tap Lock
        const blocker = document.getElementById('golf-orientation-blocker');
        if (blocker && window.PWARuntime) {
          blocker.addEventListener('click', function () {
            window.PWARuntime.lockLandscape();
          });
          blocker.addEventListener('touchstart', function () {
            window.PWARuntime.lockLandscape();
          }, { passive: true });
        }

        function checkOrientationState() {
          const isPortraitMobile = window.matchMedia('(orientation: portrait) and (pointer: coarse), (orientation: portrait) and (max-width: 768px)').matches;
          if (isPortraitMobile) {
            game.pause();
          } else {
            game.start();
            handleCanvasResize();
          }
        }

        window.addEventListener('resize', checkOrientationState);
        window.addEventListener('orientationchange', function () {
          setTimeout(checkOrientationState, 100);
          setTimeout(handleCanvasResize, 250);
        });
        checkOrientationState();

        game.start();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initStandaloneGolf);
      } else {
        initStandaloneGolf();
      }
    })();
  </script>
</body>
</html>
